name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
          cat > /tmp/notes.md <<EOF
          # VoiceSmith $V

          ## Windows 10/11 x64
          - [下载 Windows NSIS 安装器]($BASE/VoiceSmith-$V-windows-x64-setup.exe)

          ## macOS Intel
          - [下载 macOS Intel DMG]($BASE/VoiceSmith-$V-macos-intel.dmg)

          ## macOS Apple Silicon
          - [下载 macOS Apple Silicon DMG]($BASE/VoiceSmith-$V-macos-apple-silicon.dmg)

          > Windows 安装器首次启动自动下载 Windows runtime/assets。
          > macOS 安装包已构建；macOS runtime/assets 仍待单独发布。
          EOF
          gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$V" --repo "${{ github.repository }}" --title "VoiceSmith $V" --notes-file /tmp/notes.md
          gh release edit "v$V" --repo "${{ github.repository }}" --notes-file /tmp/notes.md

  installer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-13
            bundle: dmg
            platform: macos-intel
          - os: macos-14
            bundle: dmg
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist-assets
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.dmg"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" dist-assets/* --repo "${{ github.repository }}" --clobber
