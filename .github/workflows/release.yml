name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
          cat > /tmp/notes.md <<EOF
          # VoiceSmith $V

          ## Windows 10/11 x64
          - [涓嬭浇 Windows NSIS 瀹夎鍣╙($BASE/VoiceSmith-$V-windows-x64-setup.exe)

          ## macOS Intel
          - [涓嬭浇 macOS Intel DMG]($BASE/VoiceSmith-$V-macos-intel.dmg)

          ## macOS Apple Silicon
          - [涓嬭浇 macOS Apple Silicon DMG]($BASE/VoiceSmith-$V-macos-apple-silicon.dmg)

          > Windows 瀹夎鍣ㄩ娆″惎鍔ㄨ嚜鍔ㄤ笅杞?Windows runtime/assets銆?          > macOS 瀹夎鍖呭凡鏋勫缓锛沵acOS runtime/assets 浠嶅緟鍗曠嫭鍙戝竷銆?          EOF
          gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$V" --repo "${{ github.repository }}" --title "VoiceSmith $V" --notes-file /tmp/notes.md
          if [ -f "docs/releases/v$V.md" ]; then
            gh release edit "v$V" --repo "${{ github.repository }}" --notes-file "docs/releases/v$V.md"
          else
            gh release edit "v$V" --repo "${{ github.repository }}" --notes-file /tmp/notes.md
          fi

  installer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-15-intel
            bundle: dmg
            platform: macos-intel
          - os: macos-15
            bundle: dmg
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist-assets
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.dmg"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" dist-assets/* --repo "${{ github.repository }}" --clobber

