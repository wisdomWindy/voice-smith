name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/v$V.md"
          test -s "$NOTES"
          test "$(wc -c < "$NOTES")" -gt 100
          grep -q '下载' "$NOTES"
          gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$V" --repo "${{ github.repository }}" --title "VoiceSmith $V" --notes-file "$NOTES"
          gh release edit "v$V" --repo "${{ github.repository }}" --notes-file "$NOTES"

  installer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-15-intel
            bundle: dmg
            platform: macos-intel
          - os: macos-15
            bundle: dmg
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare macOS DMG bundling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mdutil -a -i off || true
          for v in /Volumes/VoiceSmith*; do
            [ -e "$v" ] && hdiutil detach "$v" -force || true
          done
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --bundles ${{ matrix.bundle }}; then
              exit 0
            fi
            echo "::warning::installer build attempt $attempt failed; detaching stale DMG mounts and retrying"
            for v in /Volumes/VoiceSmith*; do
              [ -e "$v" ] && hdiutil detach "$v" -force || true
            done
            sleep 15
          done
          exit 1
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist-assets
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp .cache/tauri-target/release/bundle/nsis/*.exe "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          else
            cp .cache/tauri-target/release/bundle/dmg/*.dmg "dist-assets/VoiceSmith-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.dmg"
          fi
          find .cache/tauri-target/release/bundle -name '*.sig' -exec cp {} dist-assets/ \;
          find .cache/tauri-target/release/bundle -name '*.app.tar.gz' -exec cp {} dist-assets/ \;
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" dist-assets/* --repo "${{ github.repository }}" --clobber

  latest:
    needs: [prepare, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p updater
          gh release download "v$V" --repo "${{ github.repository }}" --dir updater --pattern '*.sig' --pattern '*.app.tar.gz' --pattern '*.exe'
          python - <<'PY'
          import json, os, glob, datetime
          from pathlib import Path

          version = os.environ["V"]
          repo = os.environ.get("GITHUB_REPOSITORY", "wisdomWindy/voice-smith")
          base = f"https://github.com/{repo}/releases/download/v{version}"
          out = {"version": version, "notes": "VoiceSmith update", "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(), "platforms": {}}

          def add(key, asset, sig):
              if Path(asset).exists() and Path(sig).exists():
                  out["platforms"][key] = {"signature": Path(sig).read_text().strip(), "url": f"{base}/{Path(asset).name}"}

          add("windows-x86_64", f"updater/VoiceSmith-{version}-windows-x64-setup.exe", f"updater/VoiceSmith-{version}-windows-x64-setup.exe.sig")
          for key, name in (("darwin-x86_64", "macos-intel"), ("darwin-aarch64", "macos-apple-silicon")):
              apps = glob.glob("updater/*.app.tar.gz")
              if apps:
                  add(key, apps[0], apps[0] + ".sig")

          Path("updater/latest.json").write_text(json.dumps(out, ensure_ascii=False, indent=2))
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          gh release upload "v$V" updater/latest.json --repo "${{ github.repository }}" --clobber
