name: macos-runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true
        default: '0.1.3'

permissions:
  contents: write

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r sidecar/requirements.txt pyinstaller py7zr
      - name: Build frozen sidecar
        working-directory: sidecar
        run: pyinstaller --noconfirm --clean voicesmith-engine.spec
      - name: Pack runtime
        run: |
          python - <<'PY'
          import py7zr, os, hashlib
          from pathlib import Path
          base = Path('sidecar/dist/voicesmith-engine')
          out = Path('VoiceSmith-Runtime-${{ matrix.platform }}.7z')
          with py7zr.SevenZipFile(out, 'w') as z:
              for child in base.iterdir():
                  z.write(child, child.name)
          data = out.read_bytes()
          h = hashlib.sha256(data).hexdigest()
          Path('runtime-sha.txt').write_text(h)
          print('size', len(data), 'sha256', h)
          PY
      - name: Upload runtime to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V='${{ inputs.version }}'
          P='${{ matrix.platform }}'
          gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$V" --repo "${{ github.repository }}" --title "VoiceSmith $V" --notes "macOS runtime packs"
          gh release upload "v$V" "VoiceSmith-Runtime-$P.7z" "runtime-sha.txt" --repo "${{ github.repository }}" --clobber
