name: release-packs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true
      skip_build:
        description: 'Skip thin app/installer build'
        type: boolean
        default: false

permissions:
  contents: write

# Requires a self-hosted Windows runner with:
#   - Python 3.11 + network access for the embeddable Python base and get-pip
#   - prepared wheel packs in .cache/wheels-core and .cache/wheels-torch
#   - a GPT-SoVITS weights tree (VOICE_SMITH_WEIGHTS_SRC, e.g. D:\program\GPT-SoVITS-v5)
#     plus the faster-whisper cache; engine source ships in the installer
#   - 7zr.exe and Inno Setup 6
jobs:
  packs:
    runs-on: [self-hosted, Windows, X64, voicesmith]
    steps:
      - uses: actions/checkout@v4
      - name: Publish runtime + assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args = @('-Version', '${{ inputs.version }}')
          if ('${{ inputs.skip_build }}' -eq 'true') { $args += '-SkipBuild' }
          & .\scripts\publish-release.ps1 @args
