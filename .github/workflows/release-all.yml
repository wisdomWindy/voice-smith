name: release-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require versioned release note
        run: |
          test -s "docs/releases/v${VERSION}.md"
          test "$(wc -c < "docs/releases/v${VERSION}.md")" -gt 100
          grep -q '下载' "docs/releases/v${VERSION}.md"
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --repo "${{ github.repository }}" --draft \
              --title "VoiceSmith $VERSION" --notes-file "docs/releases/v${VERSION}.md"
          gh release edit "v$VERSION" --repo "${{ github.repository }}" \
            --notes-file "docs/releases/v${VERSION}.md"

  installers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-15-intel
            bundle: dmg
            platform: macos-intel
          - os: macos-15
            bundle: dmg
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "VoiceSmith-${VERSION}-windows-x64-setup.exe"
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg "VoiceSmith-${VERSION}-${{ matrix.platform }}.dmg"
          fi
          find src-tauri/target/release/bundle -name '*.sig' -exec cp {} . \;
          find src-tauri/target/release/bundle -name '*.app.tar.gz' -exec cp {} . \;
          gh release upload "v$VERSION" VoiceSmith-* --repo "${{ github.repository }}" --clobber
          while IFS= read -r -d '' f; do
            gh release upload "v$VERSION" "$f" --repo "${{ github.repository }}" --clobber
          done < <(find . -maxdepth 1 \( -name "*.sig" -o -name "*.app.tar.gz" \) -print0)

  runtime-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
          pip install -r sidecar/requirements.txt pyinstaller
      - name: Build runtime
        working-directory: sidecar
        run: pyinstaller --noconfirm --clean voicesmith-engine.spec
      - name: Pack and split
        shell: pwsh
        run: |
          & "scripts\build-runtime-pack.ps1" -RuntimeDir "$PWD\sidecar\dist\voicesmith-engine" -OutFile "$PWD\VoiceSmith-Runtime-windows-x64.7z" -SevenZip "$PWD\sidecar\7zr.exe"
          python scripts/ci/split_pack.py VoiceSmith-Runtime-windows-x64.7z runtime-windows-x64
      - name: Upload
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "v$env:VERSION" runtime-windows-x64.part* runtime-windows-x64-manifest.json --repo "${{ github.repository }}" --clobber

  runtime-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r sidecar/requirements.txt pyinstaller py7zr
      - working-directory: sidecar
        run: pyinstaller --noconfirm --clean voicesmith-engine.spec
      - name: Pack and split
        run: |
          python - <<'PY'
          import py7zr, os
          from pathlib import Path
          base = Path('sidecar/dist/voicesmith-engine'); out = Path(f"VoiceSmith-Runtime-${{ matrix.platform }}.7z")
          with py7zr.SevenZipFile(out, 'w') as z:
              for child in base.iterdir(): z.write(child, child.name)
          PY
          python scripts/ci/split_pack.py "VoiceSmith-Runtime-${{ matrix.platform }}.7z" "runtime-${{ matrix.platform }}"
      - name: Upload
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "v$VERSION" runtime-*.part* runtime-*-manifest.json --repo "${{ github.repository }}" --clobber

  assets:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse published V5 asset pack
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release download v0.1.5 --repo "${{ github.repository }}" -p 'assets-universal.part*' -p 'assets-*-manifest.json' -D base
          test -f "base/assets-universal.part01"
          cp base/assets-universal.part* .
          for p in windows-x64 macos-intel macos-arm64; do
            cp "base/assets-$p-manifest.json" "assets-$p-manifest.json"
          done
      - name: Upload
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release upload "v$VERSION" assets-universal.part* assets-windows-x64-manifest.json assets-macos-intel-manifest.json assets-macos-arm64-manifest.json --repo "${{ github.repository }}" --clobber

  finalize:
    needs: [installers, runtime-windows, runtime-macos, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAMES=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for name in \
            "VoiceSmith-${VERSION}-windows-x64-setup.exe" \
            "VoiceSmith-${VERSION}-macos-intel.dmg" \
            "VoiceSmith-${VERSION}-macos-apple-silicon.dmg" \
            "runtime-windows-x64-manifest.json" \
            "runtime-macos-intel-manifest.json" \
            "runtime-macos-arm64-manifest.json" \
            "assets-windows-x64-manifest.json" \
            "assets-macos-intel-manifest.json" \
            "assets-macos-arm64-manifest.json"; do
            echo "$NAMES" | grep -qx "$name" || { echo "missing $name"; exit 1; }
          done
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false --latest

