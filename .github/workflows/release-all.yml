name: release-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require versioned release note
        run: |
          test -s "docs/releases/v${VERSION}.md"
          test "$(wc -c < "docs/releases/v${VERSION}.md")" -gt 100
          grep -q '下载' "docs/releases/v${VERSION}.md"
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --repo "${{ github.repository }}" --draft \
              --title "VoiceSmith $VERSION" --notes-file "docs/releases/v${VERSION}.md"
          gh release edit "v$VERSION" --repo "${{ github.repository }}" \
            --notes-file "docs/releases/v${VERSION}.md"

  installers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-15-intel
            bundle: app,dmg
            platform: macos-intel
          - os: macos-15
            bundle: app,dmg
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare macOS DMG bundling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Spotlight and stale mounts make Tauri's bundle_dmg.sh fail with
          # `hdiutil: couldn't eject "diskX" - Resource busy`.
          sudo mdutil -a -i off || true
          for v in /Volumes/VoiceSmith*; do
            [ -e "$v" ] && hdiutil detach "$v" -force || true
          done
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --bundles ${{ matrix.bundle }}; then
              exit 0
            fi
            echo "::warning::installer build attempt $attempt failed; detaching stale DMG mounts and retrying"
            for v in /Volumes/VoiceSmith*; do
              [ -e "$v" ] && hdiutil detach "$v" -force || true
            done
            sleep 15
          done
          exit 1
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp .cache/tauri-target/release/bundle/nsis/*.exe "VoiceSmith-${VERSION}-windows-x64-setup.exe"
          else
            cp .cache/tauri-target/release/bundle/dmg/*.dmg "VoiceSmith-${VERSION}-${{ matrix.platform }}.dmg"
            APP=".cache/tauri-target/release/bundle/macos/VoiceSmith.app.tar.gz"
            test -s "$APP"
            cp "$APP" "VoiceSmith-${VERSION}-${{ matrix.platform }}.app.tar.gz"
            if [ -s "$APP.sig" ]; then
              cp "$APP.sig" "VoiceSmith-${VERSION}-${{ matrix.platform }}.app.tar.gz.sig"
            fi
          fi
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            find .cache/tauri-target/release/bundle -name '*.sig' -exec cp {} . \;
          fi
          gh release upload "v$VERSION" VoiceSmith-* --repo "${{ github.repository }}" --clobber
          while IFS= read -r -d '' f; do
            gh release upload "v$VERSION" "$f" --repo "${{ github.repository }}" --clobber
          done < <(find . -maxdepth 1 \( -name "*.sig" -o -name "*.app.tar.gz" \) -print0)

  runtime-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Build embedded Python base
        shell: pwsh
        run: ./scripts/build-runtime-base.ps1
      - name: Download core wheels
        shell: pwsh
        run: |
          python -m pip wheel --wheel-dir .cache/wheels-core `
            -r sidecar/requirements.txt `
            librosa scikit-learn soundfile scipy numpy numba
      - name: Download torch wheels
        shell: pwsh
        run: |
          python -m pip download --dest .cache/wheels-torch `
            --index-url https://download.pytorch.org/whl/cu128 `
            --extra-index-url https://pypi.org/simple `
            torch==2.7.1 torchaudio==2.7.1 `
            -r sidecar/requirements-engine.txt
      - name: Pack runtime components
        shell: pwsh
        run: |
          ./scripts/build-deps-pack.ps1 -Kind core -WheelsDir .cache/wheels-core
          ./scripts/build-deps-pack.ps1 -Kind torch -WheelsDir .cache/wheels-torch
      - name: Split components and generate bundle
        shell: pwsh
        run: ./scripts/split-release-assets.ps1 -Version $env:VERSION -SkipAssets
      - name: Upload
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          $files = Get-ChildItem dist-assets -File | Where-Object {
            $_.Name -match '^(runtime-base|deps-core|deps-torch)\.part\d+$' -or
            $_.Name -match '^(runtime-base|deps-core|deps-torch)-manifest\.json$' -or
            $_.Name -eq 'runtime-bundle.json'
          } | Select-Object -ExpandProperty FullName
          gh release upload "v$env:VERSION" @files --repo "${{ github.repository }}" --clobber

  runtime-macos:
    needs: prepare
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r sidecar/requirements.txt -r sidecar/requirements-engine.txt pyinstaller py7zr
      - working-directory: sidecar
        run: pyinstaller --noconfirm --clean voicesmith-engine.spec
      - name: Pack and split
        run: |
          python - <<'PY'
          import py7zr, os
          from pathlib import Path
          base = Path('sidecar/dist/voicesmith-engine'); out = Path(f"VoiceSmith-Runtime-${{ matrix.platform }}.7z")
          with py7zr.SevenZipFile(out, 'w') as z:
              for child in base.iterdir(): z.write(child, child.name)
          PY
          python scripts/ci/split_pack.py "VoiceSmith-Runtime-${{ matrix.platform }}.7z" "runtime-${{ matrix.platform }}"
      - name: Upload
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "v$VERSION" runtime-*.part* runtime-*-manifest.json --repo "${{ github.repository }}" --clobber

  # Model/tool weights are NOT built here: they are large third-party payloads
  # published by `release-packs.yml` (self-hosted runner with a weights tree) as
  # assets-<platform>-manifest.json + parts. The installer itself ships the
  # vendored engine source, so this workflow has no v5-engine dependency.

  assets-manifests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Reuse fixed V5 weights manifest
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release download v5-assets --repo "${{ github.repository }}" -p 'assets-universal-manifest-v5.json' -D base
          for p in windows-x64 macos-intel macos-arm64; do
            cp base/assets-universal-manifest-v5.json "assets-$p-manifest.json"
          done
          gh release upload "v$VERSION" assets-windows-x64-manifest.json assets-macos-intel-manifest.json assets-macos-arm64-manifest.json --repo "${{ github.repository }}" --clobber

  finalize:
    needs: [installers, runtime-windows, runtime-macos, assets-manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer and runtime artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAMES=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for name in \
            "VoiceSmith-${VERSION}-windows-x64-setup.exe" \
            "VoiceSmith-${VERSION}-macos-intel.dmg" \
            "VoiceSmith-${VERSION}-macos-apple-silicon.dmg" \
            "runtime-bundle.json" \
            "runtime-base-manifest.json" \
            "deps-core-manifest.json" \
            "deps-torch-manifest.json" \
            "runtime-macos-intel-manifest.json" \
            "runtime-macos-arm64-manifest.json"; do
            echo "$NAMES" | grep -qx "$name" || { echo "missing $name"; exit 1; }
          done
          echo "$NAMES" | grep -q '^assets-.*-manifest.json$' \
            && echo "weight assets manifest present" \
            || echo "weight assets not published yet: run release-packs before announcing the release"
      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sigs
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern '*.sig' -D sigs
          SIG_FILE="sigs/VoiceSmith_${VERSION}_x64-setup.exe.sig"
          test -s "$SIG_FILE"
          export SIG="$(cat "$SIG_FILE")"
          python scripts/ci/make_latest_json.py
          gh release upload "v$VERSION" latest.json --repo "${{ github.repository }}" --clobber
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false --latest

